[project]
name = "paper-bot"
version = "0.1.0"
description = "Paper trading bot (Alpaca) - MA crossover + RSI, dựng lại từ bài Medium của Anil Gaddam"
readme = "README.md"
authors = [
    { name = "bao292005", email = "bao292005@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.45.0",
    "chronos-forecasting>=2.3.2",
    "einops>=0.8.2",
    "fastapi>=0.165.0",
    "openai>=3.57.0",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
]

[project.scripts]
paper-bot = "paper_bot:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
